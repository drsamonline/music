name: publish-check

# The site at https://drsamonline.github.io/music/ is served by the HUB repository, not by
# this one. Pages is not enabled here, and the deploy workflow that used to live in this
# file could never succeed: it failed at `configure-pages` with "Get Pages site failed" on
# every push, which is a red X that says nothing about the code.
#
# It used to COMPARE the two copies and print a warning telling a person to run `cp`. A
# warning that asks a person to copy a file is a note that gets read once. This publishes:
# a file that differs is written to the hub, committed there, and the run says what it
# pushed. Publishing is the thing that can actually go wrong, so publishing is what is
# checked.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish every file the page needs to the hub
        env:
          # a token that can write drsamonline/drsamonline.github.io; the repository's own
          # GITHUB_TOKEN cannot reach another repository
          GH_TOKEN: ${{ secrets.FANOUT_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error title=no token::secrets.FANOUT_TOKEN is not set, so the hub cannot be written. Set it, or the site will silently keep the old files."
            exit 1
          fi
          HUB=drsamonline/drsamonline.github.io
          PATHS=$(git ls-files | grep -Ev '^(\.github/|tools/|tests/|README|LICENSE|CHANGELOG)' || true)
          pushed=0
          for p in $PATHS; do
            mine=$(sha256sum "$p" | cut -d' ' -f1)
            resp=$(gh api "repos/$HUB/contents/music/$p" 2>/dev/null || true)
            theirs=$(printf '%s' "$resp" | jq -r '.content // empty' 2>/dev/null | base64 -d 2>/dev/null | sha256sum | cut -d' ' -f1)
            sha=$(printf '%s' "$resp" | jq -r '.sha // empty' 2>/dev/null)
            if [ "$mine" = "$theirs" ]; then continue; fi
            args=(-X PUT "repos/$HUB/contents/music/$p"
                  -f "message=publish: $p from drsamonline/music@${GITHUB_SHA:0:7}"
                  -f "content=$(base64 -w0 "$p")")
            if [ -n "$sha" ]; then args+=(-f "sha=$sha"); fi
            if gh api "${args[@]}" >/dev/null 2>&1; then
              echo "published $p"
              pushed=$((pushed+1))
            else
              echo "::error file=$p::could not publish $p to the hub"
              exit 1
            fi
          done
          echo "$pushed file(s) published to $HUB"
