name: publish-check

# The site at https://drsamonline.github.io/music/ is served by the HUB repository, not by
# this one: Pages is not enabled here, and the deploy workflow that used to live in this file
# could never succeed — it failed at `configure-pages` with "Get Pages site failed" on every
# push, a red X that says nothing about the code.
#
# WHO PUBLISHES. This used to push its files to the hub from here, which needs a token with
# write access to another repository — a secret that was never set, so the run failed every
# time and the live site quietly kept old files. The hub PULLS this repository now (see
# refresh-hub.yml there), which needs no secret because this repository is public.
#
# So this workflow checks the one thing it still can: that the files the page needs are all
# here, that the manifest parses, and that nothing references a file that does not exist.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every file the page needs is present and consistent
        run: |
          set -uo pipefail
          fail=0

          # 1. the manifest parses, and every track has the fields the page renders
          python3 - <<'PY' || fail=1
          import json, sys
          # the manifest is albums, each with its own counts — the first version of this
          # check assumed a flat `tracks` list and reported all 151 missing
          m = json.load(open("data/tracks.json"))
          albums = m.get("albums", [])
          c = m.get("counts", {})
          bad = [a for a in albums if not a.get("title") or not a.get("slug") or not a.get("source")]
          no_cover = [a for a in albums if not a.get("cover_url")]
          print(f"{len(albums)} albums, {c.get('tracks', '?')} tracks, "
                f"{len(bad)} missing title/slug/source, {len(no_cover)} without a cover")
          # the counts must agree with the albums actually present
          if c.get("albums") not in (None, len(albums)):
              print(f"::error::counts.albums says {c['albums']}, the file has {len(albums)}")
              sys.exit(1)
          sys.exit(1 if bad else 0)
          PY

          # 2. every local asset referenced by the page exists
          miss=0
          for f in $(grep -oE '(src|href)="[^"#:]+"' index.html | sed -E 's/.*="([^"]+)"/\1/' | sort -u); do
            case "$f" in
              *.html|*.css|*.js|*.json|*.svg|*.png|*.jpg|*.webp)
                [ -e "$f" ] || { echo "::error file=index.html::references $f, which is not here"; miss=$((miss+1)); } ;;
            esac
          done
          [ "$miss" -gt 0 ] && fail=1

          # 3. VERSION agrees with the release the page advertises
          v=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION $v"
          grep -q "$v" index.html || { echo "::warning::index.html does not mention VERSION $v"; }

          exit $fail

      - name: The hub pulls this repository, so nothing is pushed from here
        run: |
          echo "Published by drsamonline/drsamonline.github.io (refresh-hub.yml), which clones"
          echo "this repository on its daily run. No cross-repository token is needed."
