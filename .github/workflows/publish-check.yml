name: publish-check

# The site at https://drsamonline.github.io/music/ is served by the HUB repository
# (drsamonline.github.io/music/), not by this one: Pages is not enabled here, and the
# deploy workflow that used to live in this file could never succeed — it failed at
# `configure-pages` with "Get Pages site failed" on every push, which is a red X that
# says nothing about the code.
#
# So this workflow does not deploy. It checks the thing that can actually go wrong:
# the hub's copy drifting from this repository, which is what publishing means here.
# It names the files and the copy command when they differ.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare every published file with the hub's copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # What the page needs to work. Anything else here (workflows, README, tools,
          # tests) is not published.
          PATHS=$(git ls-files | grep -Ev '^(\.github/|tools/|tests/|README|LICENSE|CHANGELOG)' || true)
          miss=0
          for p in $PATHS; do
            mine=$(sha256sum "$p" | cut -d' ' -f1)
            # A file the hub does not have is a difference, not an error: the pipeline
            # fails under `bash -e` when gh returns 404, so it is allowed to.
            theirs=$( (gh api "repos/drsamonline/drsamonline.github.io/contents/music/$p" \
                        --jq '.content' 2>/dev/null | base64 -d 2>/dev/null | sha256sum | cut -d' ' -f1) || true )
            if [ "$mine" != "$theirs" ]; then
              echo "::warning file=$p::$p differs from the hub's copy — run: cp $p ../drsamonline.github.io/music/$p"
              miss=$((miss+1))
            fi
          done
          echo "$miss published file(s) differ from the hub"
          # Deliberately exit 0. The hub copy IS the live site; a red run here would not
          # have prevented a drift, and it would sit beside the real failures. The
          # warning names the file and the copy command, which is the useful part.
          # A drift is a warning, not a failure: the hub copy is the live site, and a
          # red run here would not have prevented it. The count is the signal.
          exit 0
